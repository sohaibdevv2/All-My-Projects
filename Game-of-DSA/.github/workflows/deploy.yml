name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Primary: Deploy the interactive JS demo immediately ──────────────────
  deploy-web:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The docs/ folder is committed directly — deploy it immediately
      - name: Verify docs folder
        run: |
          echo "=== docs/ contents ==="
          ls -la docs/
          echo "index.html size: $(wc -c < docs/index.html) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Secondary: Try to build WASM (best-effort, doesn't block deploy) ─────
  build-wasm:
    name: Build WebAssembly (optional)
    runs-on: ubuntu-22.04
    continue-on-error: true   # Won't fail the workflow if WASM build fails

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ~/emsdk
          key: emsdk-3.1.50-${{ runner.os }}

      - name: Install Emscripten
        run: |
          if [ ! -d ~/emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          fi
          cd ~/emsdk
          ./emsdk install 3.1.50
          ./emsdk activate 3.1.50

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake git python3

      - name: Configure (Emscripten)
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --build build-web --parallel 4
        timeout-minutes: 20

      - name: Merge WASM into docs/
        run: |
          for f in build-web/index.html build-web/index.js build-web/index.wasm build-web/index.data; do
            [ -f "$f" ] && cp "$f" docs/ && echo "Copied $f"
          done
          echo "=== Updated docs/ ==="
          ls -lh docs/

      - name: Commit WASM build to docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "ci: update WASM build in docs/ [skip ci]"
          git push

  # ── Desktop build checks ──────────────────────────────────────────────────
  build-desktop-linux:
    name: Desktop Build (Linux)
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential cmake git \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libgl1-mesa-dev libasound2-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --parallel 4

      - name: Verify
        run: |
          ls -lh build/GameOfDSA && echo "✅ Linux build OK"
