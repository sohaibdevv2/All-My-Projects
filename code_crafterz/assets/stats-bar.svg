<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2e1065" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0533" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <style>
    .bar { animation: grow 1.8s ease-out forwards; transform-origin: left; transform: scaleX(0); }
    .bar:nth-child(1) { animation-delay: 0.2s; }
    .bar:nth-child(2) { animation-delay: 0.5s; }
    .bar:nth-child(3) { animation-delay: 0.8s; }
    .bar:nth-child(4) { animation-delay: 1.1s; }
    .bar:nth-child(5) { animation-delay: 1.4s; }
    @keyframes grow {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
    .num { animation: fadeIn 1s ease-out forwards; opacity: 0; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .num1 { animation-delay: 0.3s; }
    .num2 { animation-delay: 0.6s; }
    .num3 { animation-delay: 0.9s; }
    .num4 { animation-delay: 1.2s; }
  </style>

  <rect width="900" height="120" rx="14" fill="url(#cardBg)" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Stat cards -->
  <g class="num num1">
    <text x="112" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#e9d5ff">200+</text>
    <text x="112" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#9d7cbf" letter-spacing="1.5">TUTORIALS</text>
  </g>
  <line x1="224" y1="25" x2="224" y2="95" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>

  <g class="num num2">
    <text x="337" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#e9d5ff">34</text>
    <text x="337" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#9d7cbf" letter-spacing="1.5">CATEGORIES</text>
  </g>
  <line x1="450" y1="25" x2="450" y2="95" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>

  <g class="num num3">
    <text x="562" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#e9d5ff">15+</text>
    <text x="562" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#9d7cbf" letter-spacing="1.5">LANGUAGES</text>
  </g>
  <line x1="674" y1="25" x2="674" y2="95" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>

  <g class="num num4">
    <text x="787" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#e9d5ff">∞</text>
    <text x="787" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#9d7cbf" letter-spacing="1.5">TO BUILD</text>
  </g>

  <!-- Bottom progress bar -->
  <rect x="20" y="100" width="860" height="4" rx="2" fill="#3b0764"/>
  <rect class="bar" x="20" y="100" width="860" height="4" rx="2" fill="url(#barGrad)"/>
</svg>
