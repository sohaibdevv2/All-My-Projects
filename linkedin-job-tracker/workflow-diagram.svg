<svg width="900" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff" opacity="0.8"/>
    </marker>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="120" fill="#0d1117" rx="10"/>

  <!-- Step boxes -->
  <!-- 1: Schedule -->
  <rect x="20" y="35" width="110" height="50" fill="#161b22" stroke="#00d4ff" stroke-width="1.5" rx="8"/>
  <text x="75" y="56" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle">⏰ Schedule</text>
  <text x="75" y="72" font-family="monospace" font-size="10" fill="#8892b0" text-anchor="middle">Every 30 min</text>

  <!-- Arrow -->
  <line x1="132" y1="60" x2="158" y2="60" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 2: LinkedIn -->
  <rect x="160" y="35" width="130" height="50" fill="#161b22" stroke="#0077b5" stroke-width="1.5" rx="8"/>
  <text x="225" y="56" font-family="monospace" font-size="11" fill="#0077b5" text-anchor="middle">🔍 LinkedIn</text>
  <text x="225" y="72" font-family="monospace" font-size="10" fill="#8892b0" text-anchor="middle">57 searches</text>

  <!-- Arrow -->
  <line x1="292" y1="60" x2="318" y2="60" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 3: Parse + Dedup -->
  <rect x="320" y="35" width="140" height="50" fill="#161b22" stroke="#00ff88" stroke-width="1.5" rx="8"/>
  <text x="390" y="56" font-family="monospace" font-size="11" fill="#00ff88" text-anchor="middle">⚙️ Parse + Dedup</text>
  <text x="390" y="72" font-family="monospace" font-size="10" fill="#8892b0" text-anchor="middle">Zero duplicates</text>

  <!-- Arrow -->
  <line x1="462" y1="60" x2="488" y2="60" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 4: Filter -->
  <rect x="490" y="35" width="120" height="50" fill="#161b22" stroke="#ffcc00" stroke-width="1.5" rx="8"/>
  <text x="550" y="56" font-family="monospace" font-size="11" fill="#ffcc00" text-anchor="middle">🎯 Smart Filter</text>
  <text x="550" y="72" font-family="monospace" font-size="10" fill="#8892b0" text-anchor="middle">Tier 1/2/3/4</text>

  <!-- Arrow -->
  <line x1="612" y1="60" x2="638" y2="60" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 5: Google Sheets -->
  <rect x="640" y="35" width="130" height="50" fill="#161b22" stroke="#34a853" stroke-width="1.5" rx="8"/>
  <text x="705" y="56" font-family="monospace" font-size="11" fill="#34a853" text-anchor="middle">📊 Google Sheets</text>
  <text x="705" y="72" font-family="monospace" font-size="10" fill="#8892b0" text-anchor="middle">Auto written</text>

  <!-- Arrow -->
  <line x1="772" y1="60" x2="798" y2="60" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 6: Done -->
  <rect x="800" y="35" width="80" height="50" fill="#161b22" stroke="#00ff88" stroke-width="1.5" rx="8"/>
  <text x="840" y="56" font-family="monospace" font-size="11" fill="#00ff88" text-anchor="middle">✅ Done</text>
  <text x="840" y="72" font-family="monospace" font-size="10" fill="#8892b0" text-anchor="middle">24/7</text>
</svg>
