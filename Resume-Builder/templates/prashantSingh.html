<div class="resume-template ps-tpl">
<style>
.ps-tpl { background:#fff; color:#1a1a1a; font-family:'Georgia','Times New Roman',serif; font-size:9pt; line-height:1.4; padding:38px 44px; max-width:794px; margin:0 auto; }
.ps-tpl .ps-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.ps-tpl .ps-left .r-name { font-size:17pt; font-weight:700; color:#111; margin:0 0 3px; }
.ps-tpl .ps-left .r-title { font-size:9.5pt; color:#333; margin:0; }
.ps-tpl .ps-left .ps-sub { font-size:9pt; color:#444; margin-top:1px; }
.ps-tpl .ps-right { text-align:right; font-size:8.6pt; color:#333; line-height:1.7; }
.ps-tpl .ps-right span { display:block; }
.ps-tpl .r-sec { font-size:10.5pt; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:#111; border-bottom:1px solid #555; padding-bottom:2px; margin:13px 0 6px; font-variant:small-caps; }
.ps-tpl .r-block { margin-bottom:5px; }
.ps-tpl .r-sum { font-size:9pt; color:#222; line-height:1.5; margin:0; }
.ps-tpl .experience-entry,.ps-tpl .education-entry { margin-bottom:9px; }
.ps-tpl .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; }
.ps-tpl .entry-title { font-size:9.6pt; font-weight:700; color:#111; margin:0; }
.ps-tpl .entry-title::before { content:'• '; color:#111; }
.ps-tpl .entry-dates { font-size:8.6pt; font-style:italic; color:#555; margin-left:auto; }
.ps-tpl .entry-company,.ps-tpl .entry-school { font-size:8.8pt; color:#444; font-style:italic; flex-basis:100%; margin-top:1px; padding-left:10px; }
.ps-tpl .entry-description { font-size:8.8pt; color:#222; line-height:1.45; margin-top:2px; padding-left:10px; }
.ps-tpl .entry-description ul { margin:1px 0; padding-left:16px; list-style:'– '; }
.ps-tpl .entry-description li { margin-bottom:1px; }
.ps-tpl .ps-skillrow { font-size:8.9pt; color:#222; margin-bottom:3px; line-height:1.5; }
.ps-tpl .ps-skillrow b { font-weight:700; }
.ps-tpl .skill-tag { background:none !important; color:inherit !important; padding:0 !important; border-radius:0 !important; font-size:8.9pt; font-weight:400; display:inline; }
.ps-tpl #previewSkills .skill-tag:not(:last-child)::after { content:', '; }
.ps-tpl #previewLanguages .skill-tag:not(:last-child)::after { content:', '; }
.ps-tpl ul.r-list { margin:2px 0; padding-left:16px; list-style:'– '; }
.ps-tpl ul.r-list li { margin-bottom:2px; font-size:8.8pt; color:#222; }
</style>
  <div class="ps-top">
    <div class="ps-left">
      <div class="r-name" id="previewName">Prashant Singh</div>
      <div class="r-title" id="previewJobTitle">Bachelor of Technology</div>
    </div>
    <div class="ps-right">
      <span id="previewPhone">+91-xxxxxxxx</span>
      <span id="previewEmail">name@gmail.com</span>
      <span id="previewLocation">City, India</span>
      <span id="previewLinkedIn"></span>
    </div>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Personal Projects</div><ul class="r-list" id="previewProjects"></ul></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Technical Skills and Interests</div>
    <div class="ps-skillrow"><b>Skills:</b> <span id="previewSkills"></span></div>
    <div class="ps-skillrow"><b>Languages:</b> <span id="previewLanguages"></span></div>
  </div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul class="r-list" id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Positions of Responsibility</div><ul class="r-list" id="previewAwards"></ul></div>
</div>
