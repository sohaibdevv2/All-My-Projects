<div class="resume-template atsblue">
<style>
.atsblue { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atsblue .experience-entry,.atsblue .education-entry { margin-bottom:12px; }
.atsblue .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atsblue .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atsblue .entry-company,.atsblue .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsblue .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsblue .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atsblue ul { margin:0; padding-left:15px; }
.atsblue li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atsblue .r-block { margin-bottom:17px; }
.atsblue .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atsblue { border-top:6px solid var(--primary-color,#2563eb); }
.atsblue .r-name { font-size:24pt; font-weight:800; color:#1a1a1a; }
.atsblue .r-title { font-size:11pt; color:var(--primary-color,#2563eb); font-weight:600; margin:3px 0 8px; }
.atsblue .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.5pt; color:#555; margin-bottom:16px; }
.atsblue .r-sec { font-size:9.5pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2563eb); margin:0 0 10px; }
.atsblue .skill-tag { background:#eef2ff; color:#3730a3; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
</div>
