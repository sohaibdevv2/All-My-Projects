<div class="resume-template cvtech-t">
<style>
.cvtech-t { background:#fff; color:#2d2d2d; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:40px 46px; max-width:794px; margin:0 auto; }
.cvtech-t .experience-entry,.cvtech-t .education-entry { margin-bottom:12px; }
.cvtech-t .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.cvtech-t .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.cvtech-t .entry-company,.cvtech-t .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.cvtech-t .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.cvtech-t .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.cvtech-t ul { margin:0; padding-left:15px; }
.cvtech-t li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.cvtech-t .skill-tag { display:inline-block; background:#f2f2f2; color:#333; padding:3px 9px; border-radius:4px; font-size:8pt; margin:0 4px 5px 0; }
.cvtech-t { background:#0d1710; color:#e6f5ec; font-family:'Courier New',monospace; }
.cvtech-t .r-name { font-size:20pt; font-weight:700; color:var(--primary-color,#52c27a); letter-spacing:2px; }
.cvtech-t .r-title { font-size:9.5pt; color:#a3cfb8; margin:4px 0 9px; }
.cvtech-t .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.2pt; color:#7aab8c; border-bottom:1px solid #1e3524; padding-bottom:12px; margin-bottom:16px; }
.cvtech-t .r-sec { font-size:9pt; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:var(--primary-color,#52c27a); margin:0 0 10px; }
.cvtech-t .r-sec::before { content:'// '; color:#7aab8c; }
.cvtech-t .r-block { margin-bottom:18px; border-left:2px solid #1e3524; padding-left:14px; }
.cvtech-t .entry-title { color:#e6f5ec; }
.cvtech-t .entry-description { color:#a3cfb8; }
.cvtech-t .skill-tag { background:#1e3524; color:#52c27a; border:1px solid #2d4a30; }
.cvtech-t li { color:#a3cfb8; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">profile</div><p id="previewSummary" style="font-size:9pt;color:#a3cfb8;line-height:1.6"></p></div>
  <div class="r-block"><div class="r-sec">tech_stack</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">projects</div><ul id="previewProjects"></ul></div>
  <div class="r-block"><div class="r-sec">education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">certifications</div><ul id="previewCertifications"></ul></div>
</div>
