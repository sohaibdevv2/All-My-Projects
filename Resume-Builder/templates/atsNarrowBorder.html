<div class="resume-template atsnarrowborder">
<style>
.atsnarrowborder { background:#fff; color:#1a1a1a; font-family:'Inter',sans-serif; font-size:9pt; line-height:1.55; padding:42px 44px 42px 54px; max-width:794px; margin:0 auto; border-left:4px solid var(--primary-color,#2d8653); }
.atsnarrowborder .r-name { font-size:22pt; font-weight:800; color:#111; }
.atsnarrowborder .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 8px; }
.atsnarrowborder .r-contact { display:flex; flex-wrap:wrap; gap:4px 18px; font-size:8pt; color:#555; margin-bottom:18px; }
.atsnarrowborder .r-sec { font-size:9pt; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--primary-color,#2d8653); margin:0 0 9px; }
.atsnarrowborder .r-block { margin-bottom:18px; }
.atsnarrowborder .r-sum { font-size:8.8pt; color:#444; line-height:1.65; }
.atsnarrowborder .experience-entry,.atsnarrowborder .education-entry { margin-bottom:12px; padding-left:10px; border-left:2px solid #e5e7eb; }
.atsnarrowborder .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px; }
.atsnarrowborder .entry-title { font-size:9.8pt; font-weight:700; color:#111; margin:0; }
.atsnarrowborder .entry-company,.atsnarrowborder .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsnarrowborder .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsnarrowborder .entry-description { font-size:8.5pt; color:#555; line-height:1.55; margin-top:3px; }
.atsnarrowborder ul { margin:0; padding-left:16px; } .atsnarrowborder li { margin-bottom:3px; font-size:8.5pt; color:#555; }
.atsnarrowborder .skill-tag { display:inline-block; padding:2px 10px; border:1px solid var(--primary-color,#2d8653); color:var(--primary-color,#2d8653); border-radius:20px; font-size:8pt; margin:0 4px 4px 0; }
</style>
