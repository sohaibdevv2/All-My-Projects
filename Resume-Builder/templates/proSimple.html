<div class="resume-template proSimple-template">
<style>
.proSimple-template { background:#fff; color:#2d2d2d; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:40px 44px; max-width:794px; margin:0 auto; }
.proSimple-template .ps-top { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:2px solid var(--primary-color,#2d8653); padding-bottom:16px; margin-bottom:16px; }
.proSimple-template .ps-name { font-size:23pt; font-weight:700; color:#1a1a1a; letter-spacing:-0.5px; line-height:1.1; }
.proSimple-template .ps-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:4px 0 8px; }
.proSimple-template .ps-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.3pt; color:#555; }
.proSimple-template .ps-photo { width:84px; height:84px; border-radius:50%; flex-shrink:0; background:#e8f5e3 center/cover no-repeat; border:3px solid var(--primary-color,#2d8653); }
.proSimple-template .ps-summary { font-size:9pt; color:#444; line-height:1.6; margin-bottom:18px; }
.proSimple-template .ps-cols { display:grid; grid-template-columns:1.6fr 1fr; gap:28px; }
.proSimple-template .ps-sec-title { font-size:9.5pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); border-bottom:1px solid #e0e0e0; padding-bottom:4px; margin:0 0 10px; }
.proSimple-template .ps-block { margin-bottom:18px; }
.proSimple-template .experience-entry, .proSimple-template .education-entry { margin-bottom:12px; }
.proSimple-template .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.proSimple-template .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.proSimple-template .entry-company, .proSimple-template .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.proSimple-template .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.proSimple-template .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.proSimple-template .skill-tag { display:inline-block; background:#f0f6f2; color:#2d5a3f; padding:3px 9px; border-radius:4px; font-size:8pt; margin:0 4px 5px 0; border:1px solid #dde9e1; }
.proSimple-template ul { margin:0; padding-left:15px; }
.proSimple-template li { font-size:8.6pt; color:#555; margin-bottom:3px; }
</style>
  <div class="ps-top">
    <div>
      <div class="ps-name" id="previewName">Your Name</div>
      <div class="ps-title" id="previewJobTitle">Professional Title</div>
      <div class="ps-contact">
        <span id="previewEmail">email@example.com</span>
        <span id="previewPhone">+1 555 123 4567</span>
        <span id="previewLocation">City, Country</span>
        <span id="previewLinkedIn"></span>
      </div>
    </div>
    <div class="ps-photo" id="profilePhoto"></div>
  </div>
  <p class="ps-summary" id="previewSummary">Professional summary appears here...</p>
  <div class="ps-cols">
    <div class="ps-left">
      <div class="ps-block">
        <div class="ps-sec-title">Experience</div>
        <div id="previewExperience"></div>
      </div>
      <div class="ps-block">
        <div class="ps-sec-title">Education</div>
        <div id="previewEducation"></div>
      </div>
      <div class="ps-block">
        <div class="ps-sec-title">Projects</div>
        <ul id="previewProjects"></ul>
      </div>
    </div>
    <div class="ps-right">
      <div class="ps-block">
        <div class="ps-sec-title">Skills</div>
        <div id="previewSkills"></div>
      </div>
      <div class="ps-block">
        <div class="ps-sec-title">Languages</div>
        <div id="previewLanguages"></div>
      </div>
      <div class="ps-block">
        <div class="ps-sec-title">Certifications</div>
        <ul id="previewCertifications"></ul>
      </div>
      <div class="ps-block">
        <div class="ps-sec-title">Awards</div>
        <ul id="previewAwards"></ul>
      </div>
    </div>
  </div>
</div>
