<div class="resume-template atscrossrule">
<style>
.atscrossrule { background:#fff; color:#1a1a1a; font-family:'Inter',sans-serif; font-size:9pt; line-height:1.55; padding:42px 50px; max-width:794px; margin:0 auto; }
.atscrossrule .r-name { font-size:23pt; font-weight:800; color:#111; }
.atscrossrule .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 6px; }
.atscrossrule .r-contact { display:flex; flex-wrap:wrap; gap:4px 18px; font-size:8.2pt; color:#555; margin-bottom:18px; }
.atscrossrule .r-sec-wrap { display:flex; align-items:center; gap:12px; margin:0 0 10px; }
.atscrossrule .r-sec { font-size:9pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); white-space:nowrap; }
.atscrossrule .r-sec-line { flex:1; height:1px; background:var(--primary-color,#2d8653); opacity:0.3; }
.atscrossrule .r-block { margin-bottom:18px; }
.atscrossrule .r-sum { font-size:8.8pt; color:#444; line-height:1.65; }
.atscrossrule .experience-entry,.atscrossrule .education-entry { margin-bottom:12px; }
.atscrossrule .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px; }
.atscrossrule .entry-title { font-size:9.8pt; font-weight:700; color:#111; margin:0; }
.atscrossrule .entry-company,.atscrossrule .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atscrossrule .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atscrossrule .entry-description { font-size:8.5pt; color:#555; line-height:1.55; margin-top:3px; }
.atscrossrule ul { margin:0; padding-left:16px; } .atscrossrule li { margin-bottom:3px; font-size:8.5pt; color:#555; }
.atscrossrule .skill-tag { display:inline-block; padding:2px 10px; background:#f8fafb; border:1px solid #e2e8f0; color:#333; border-radius:4px; font-size:8pt; margin:0 4px 4px 0; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail"></span>
    <span id="previewPhone"></span>
    <span id="previewLocation"></span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec-wrap"><span class="r-sec">Summary</span><span class="r-sec-line"></span></div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec-wrap"><span class="r-sec">Experience</span><span class="r-sec-line"></span></div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec-wrap"><span class="r-sec">Education</span><span class="r-sec-line"></span></div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec-wrap"><span class="r-sec">Skills</span><span class="r-sec-line"></span></div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec-wrap"><span class="r-sec">Projects</span><span class="r-sec-line"></span></div><ul id="previewProjects"></ul></div>
  <div class="r-block"><div class="r-sec-wrap"><span class="r-sec">Certifications</span><span class="r-sec-line"></span></div><ul id="previewCertifications"></ul></div>
</div>
