<div class="resume-template atsleaderpro">
<style>
.atsleaderpro { background:#fff; color:#1a1a1a; font-family:'Inter',sans-serif; font-size:9pt; line-height:1.55; max-width:794px; margin:0 auto; }
.atsleaderpro .r-header { padding:32px 48px 20px; border-bottom:3px solid var(--primary-color,#2d8653); }
.atsleaderpro .r-name { font-size:24pt; font-weight:800; color:#111; letter-spacing:-0.3px; }
.atsleaderpro .r-title { font-size:11pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 10px; }
.atsleaderpro .r-contact { display:flex; flex-wrap:wrap; gap:4px 20px; font-size:8pt; color:#555; }
.atsleaderpro .r-body { display:grid; grid-template-columns:2fr 1fr; gap:0; }
.atsleaderpro .r-main { padding:24px 36px 24px 48px; }
.atsleaderpro .r-aside { padding:24px 20px 24px 20px; background:#f9fafb; border-left:1px solid #e5e7eb; }
.atsleaderpro .r-sec { font-size:9pt; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--primary-color,#2d8653); border-bottom:1px solid #e5e7eb; padding-bottom:4px; margin:0 0 10px; }
.atsleaderpro .r-block { margin-bottom:18px; }
.atsleaderpro .r-sum { font-size:8.8pt; color:#444; line-height:1.65; }
.atsleaderpro .experience-entry,.atsleaderpro .education-entry { margin-bottom:12px; }
.atsleaderpro .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px; }
.atsleaderpro .entry-title { font-size:9.8pt; font-weight:700; color:#111; margin:0; }
.atsleaderpro .entry-company,.atsleaderpro .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsleaderpro .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsleaderpro .entry-description { font-size:8.5pt; color:#555; line-height:1.55; margin-top:3px; }
.atsleaderpro ul { margin:0; padding-left:15px; } .atsleaderpro li { margin-bottom:3px; font-size:8.5pt; color:#555; }
.atsleaderpro .skill-tag { display:block; padding:3px 0; font-size:8.2pt; color:#333; border-bottom:1px solid #e5e7eb; }
</style>
  <div class="r-header">
    <div class="r-name" id="previewName">Your Name</div>
    <div class="r-title" id="previewJobTitle">Professional Title</div>
    <div class="r-contact">
      <span id="previewEmail">email@example.com</span>
      <span id="previewPhone">+1 555 123 4567</span>
      <span id="previewLocation">City, Country</span>
      <span id="previewLinkedIn"></span>
    </div>
  </div>
  <div class="r-body">
    <div class="r-main">
      <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
      <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
      <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
    </div>
    <div class="r-aside">
      <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
      <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
      <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
      <div class="r-block"><div class="r-sec">Awards</div><ul id="previewAwards"></ul></div>
    </div>
  </div>
</div>
