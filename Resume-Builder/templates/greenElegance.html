<div class="resume-template ge-tpl">
<style>
.ge-tpl { background:#fff; color:#2a2a2a; font-family:'Calibri','Arial',sans-serif; font-size:8.8pt; line-height:1.45; padding:34px 40px; max-width:794px; margin:0 auto; }
.ge-tpl .ge-head { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid #ddd; padding-bottom:12px; margin-bottom:14px; }
.ge-tpl .ge-head-left .r-name { font-size:21pt; font-weight:700; color:var(--primary-color,#2d8653); margin:0 0 3px; }
.ge-tpl .ge-head-left .r-title { font-size:9.5pt; color:#555; margin:0 0 5px; }
.ge-tpl .r-contact { font-size:8.3pt; color:#555; }
.ge-tpl .r-contact span:not(:last-child)::after { content:'   •   '; color:#bbb; }
.ge-tpl .ge-photo { width:78px; height:78px; border-radius:50%; background:#e8f5e3 center/cover no-repeat; border:2px solid var(--primary-color,#2d8653); flex-shrink:0; margin-left:16px; }
.ge-tpl .ge-cols { display:grid; grid-template-columns:2.1fr 1fr; gap:26px; }
.ge-tpl .r-sec { font-size:9.5pt; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--primary-color,#2d8653); border-bottom:1.5px solid var(--primary-color,#2d8653); padding-bottom:2px; margin:0 0 8px; }
.ge-tpl .r-block,.ge-tpl .ge-side-block { margin-bottom:14px; }
.ge-tpl .r-sum { font-size:8.7pt; color:#333; line-height:1.5; margin:0; }
.ge-tpl .experience-entry,.ge-tpl .education-entry { margin-bottom:10px; }
.ge-tpl .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; }
.ge-tpl .entry-title { font-size:9.3pt; font-weight:700; color:#1a1a1a; margin:0; }
.ge-tpl .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.ge-tpl .entry-company,.ge-tpl .entry-school { font-size:8.5pt; color:var(--primary-color,#2d8653); font-weight:600; flex-basis:100%; margin-top:1px; }
.ge-tpl .entry-description { font-size:8.4pt; color:#333; line-height:1.5; margin-top:3px; }
.ge-tpl .entry-description ul { margin:2px 0; padding-left:15px; }
.ge-tpl .entry-description li { margin-bottom:2px; }
.ge-tpl #previewSkills .skill-tag { display:inline-block; background:#e8f5e3; color:#1a6b3f; padding:3px 9px; border-radius:12px; font-size:8pt; margin:0 4px 4px 0; }
.ge-tpl #previewEducation .entry-title { font-size:8.9pt; }
.ge-tpl ul.r-list { margin:2px 0; padding-left:15px; }
.ge-tpl ul.r-list li { margin-bottom:2px; font-size:8.4pt; color:#333; }
.ge-tpl #previewLanguages .skill-tag { display:block; font-size:8.2pt; color:#333; margin-bottom:3px; }
</style>
  <div class="ge-head">
    <div class="ge-head-left">
      <div class="r-name" id="previewName">Sarah Thompson</div>
      <div class="r-title" id="previewJobTitle">Project Manager</div>
      <div class="r-contact">
        <span id="previewEmail">email@example.com</span>
        <span id="previewPhone">+1 555 123 4567</span>
        <span id="previewLocation">City, Country</span>
        <span id="previewLinkedIn"></span>
      </div>
    </div>
    <div class="ge-photo" id="profilePhoto"></div>
  </div>
  <div class="ge-cols">
    <div class="ge-main">
      <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
      <div class="r-block"><div class="r-sec">Work Experience</div><div id="previewExperience"></div></div>
      <div class="r-block"><div class="r-sec">Projects</div><ul class="r-list" id="previewProjects"></ul></div>
      <div class="r-block"><div class="r-sec">Achievements</div><ul class="r-list" id="previewAwards"></ul></div>
    </div>
    <div class="ge-side">
      <div class="ge-side-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
      <div class="ge-side-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
      <div class="ge-side-block"><div class="r-sec">Certifications</div><ul class="r-list" id="previewCertifications"></ul></div>
      <div class="ge-side-block"><div class="r-sec">Languages</div><div id="previewLanguages"></div></div>
    </div>
  </div>
</div>
