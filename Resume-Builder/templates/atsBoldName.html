<div class="resume-template atsbold">
<style>
.atsbold { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atsbold .experience-entry,.atsbold .education-entry { margin-bottom:12px; }
.atsbold .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atsbold .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atsbold .entry-company,.atsbold .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsbold .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsbold .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atsbold ul { margin:0; padding-left:15px; }
.atsbold li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atsbold .r-block { margin-bottom:17px; }
.atsbold .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atsbold .r-name { font-size:30pt; font-weight:800; color:var(--primary-color,#2d8653); letter-spacing:-1px; line-height:1; }
.atsbold .r-title { font-size:11pt; color:#444; font-weight:500; margin:6px 0 8px; text-transform:uppercase; letter-spacing:2px; }
.atsbold .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.5pt; color:#555; border-bottom:2px solid #1a1a1a; padding-bottom:12px; margin-bottom:16px; }
.atsbold .r-sec { font-size:10pt; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a1a1a; margin:0 0 10px; }
.atsbold .skill-tag { background:#f2f2f2; color:#333; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
</div>
