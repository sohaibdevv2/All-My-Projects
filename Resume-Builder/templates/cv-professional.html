<div class="resume-template cvpro-t">
<style>
.cvpro-t { background:#fff; color:#2d2d2d; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:40px 46px; max-width:794px; margin:0 auto; }
.cvpro-t .experience-entry,.cvpro-t .education-entry { margin-bottom:12px; }
.cvpro-t .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.cvpro-t .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.cvpro-t .entry-company,.cvpro-t .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.cvpro-t .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.cvpro-t .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.cvpro-t ul { margin:0; padding-left:15px; }
.cvpro-t li { font-size:8.6pt; color:#555; margin-bottom:3px; }

.cvpro-t { border-top:5px solid var(--primary-color,#2d8653); }
.cvpro-t .r-name { font-size:25pt; font-weight:700; color:#1a1a1a; }
.cvpro-t .r-title { font-size:11pt; color:var(--primary-color,#2d8653); font-weight:600; margin:4px 0 8px; }
.cvpro-t .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.5pt; color:#555; border-bottom:1px solid #e0e0e0; padding-bottom:14px; margin-bottom:16px; }
.cvpro-t .r-sec { font-size:10pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); margin:0 0 10px; border-bottom:1px solid #e0e0e0; padding-bottom:4px; }
.cvpro-t .r-block { margin-bottom:18px; }
