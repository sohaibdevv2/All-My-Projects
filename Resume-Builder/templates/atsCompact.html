<div class="resume-template atscompact">
<style>
.atscompact { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atscompact .experience-entry,.atscompact .education-entry { margin-bottom:12px; }
.atscompact .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atscompact .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atscompact .entry-company,.atscompact .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atscompact .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atscompact .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atscompact ul { margin:0; padding-left:15px; }
.atscompact li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atscompact .r-block { margin-bottom:17px; }
.atscompact .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atscompact { padding:34px 42px; font-size:8.8pt; }
.atscompact .r-name { font-size:20pt; font-weight:700; color:#1a1a1a; display:inline; }
.atscompact .r-title { font-size:10pt; color:var(--primary-color,#2d8653); font-weight:600; display:inline; margin-left:10px; }
.atscompact .r-contact { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:8pt; color:#555; margin:6px 0 12px; padding-bottom:10px; border-bottom:1px solid #ddd; }
.atscompact .r-block { margin-bottom:13px; }
.atscompact .r-sec { font-size:9pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); margin:0 0 7px; }
.atscompact .skill-tag { background:#f0f6f2; color:#2d5a3f; padding:2px 7px; font-size:7.6pt; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
</div>
