<div class="resume-template bb-tpl">
<style>
.bb-tpl { background:#fff; color:#2a2a2a; font-family:'Arial','Helvetica',sans-serif; font-size:8.8pt; line-height:1.45; max-width:794px; margin:0 auto; }
.bb-tpl .bb-head { background:#3a3f47; color:#fff; padding:22px 36px; }
.bb-tpl .r-name { font-size:21pt; font-weight:700; color:#fff; margin:0; }
.bb-tpl .r-title { font-size:9pt; color:#cfd3d8; margin-top:3px; }
.bb-tpl .bb-cols { display:grid; grid-template-columns:1fr 2.1fr; }
.bb-tpl .bb-side { padding:22px 20px 22px 36px; }
.bb-tpl .bb-main { padding:22px 36px 22px 24px; }
.bb-tpl .r-contact { display:flex; flex-direction:column; gap:5px; font-size:8.2pt; color:#444; margin-bottom:16px; }
.bb-tpl .r-side-sec { font-size:11pt; font-weight:400; color:#222; border-bottom:1px solid #ccc; padding-bottom:3px; margin:0 0 9px; }
.bb-tpl .r-sec { font-size:11pt; font-weight:400; color:#222; border-bottom:1px solid #ccc; padding-bottom:3px; margin:0 0 9px; }
.bb-tpl .r-block,.bb-tpl .bb-side-block { margin-bottom:16px; }
.bb-tpl .r-sum { font-size:8.6pt; color:#333; line-height:1.5; margin:0; }
.bb-tpl #previewSkills .skill-tag { display:block; background:#eef1f4; color:#2a2a2a; padding:4px 10px; border-radius:3px; font-size:8.2pt; margin-bottom:5px; }
.bb-tpl .experience-entry,.bb-tpl .education-entry { margin-bottom:11px; }
.bb-tpl .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; }
.bb-tpl .entry-title { font-size:9.4pt; font-weight:700; color:#1a1a1a; margin:0; }
.bb-tpl .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.bb-tpl .entry-company,.bb-tpl .entry-school { font-size:8.4pt; color:#555; flex-basis:100%; margin-top:1px; }
.bb-tpl .entry-description { font-size:8.4pt; color:#333; line-height:1.5; margin-top:3px; }
.bb-tpl .entry-description ul { margin:2px 0; padding-left:15px; }
.bb-tpl .entry-description li { margin-bottom:2px; }
.bb-tpl #previewEducation .entry-title { font-size:9pt; }
.bb-tpl ul.r-list { margin:2px 0; padding-left:15px; }
.bb-tpl ul.r-list li { margin-bottom:2px; font-size:8.4pt; color:#333; }
.bb-tpl #previewLanguages .skill-tag { display:block; font-size:8.2pt; color:#333; margin-bottom:3px; }
</style>
  <div class="bb-head">
    <div class="r-name" id="previewName">Alexander Reed</div>
    <div class="r-title" id="previewJobTitle">Management Consultant</div>
  </div>
  <div class="bb-cols">
    <div class="bb-side">
      <div class="bb-side-block">
        <div class="r-contact">
          <span id="previewEmail">email@example.com</span>
          <span id="previewPhone">+1 555 123 4567</span>
          <span id="previewLocation">City, Country</span>
          <span id="previewLinkedIn"></span>
        </div>
      </div>
      <div class="bb-side-block"><div class="r-side-sec">Skills</div><div id="previewSkills"></div></div>
      <div class="bb-side-block"><div class="r-side-sec">Education</div><div id="previewEducation"></div></div>
      <div class="bb-side-block"><div class="r-side-sec">Languages</div><div id="previewLanguages"></div></div>
    </div>
    <div class="bb-main">
      <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
      <div class="r-block"><div class="r-sec">Work Experience</div><div id="previewExperience"></div></div>
      <div class="r-block"><div class="r-sec">Projects</div><ul class="r-list" id="previewProjects"></ul></div>
      <div class="r-block"><div class="r-sec">Certifications and Training</div><ul class="r-list" id="previewCertifications"></ul></div>
      <div class="r-block"><div class="r-sec">Achievements</div><ul class="r-list" id="previewAwards"></ul></div>
    </div>
  </div>
</div>
