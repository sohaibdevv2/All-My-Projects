<div class="resume-template atsgray">
<style>
.atsgray { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atsgray .experience-entry,.atsgray .education-entry { margin-bottom:12px; }
.atsgray .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atsgray .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atsgray .entry-company,.atsgray .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsgray .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsgray .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atsgray ul { margin:0; padding-left:15px; }
.atsgray li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atsgray .r-block { margin-bottom:17px; }
.atsgray .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atsgray { background:#fafafa; }
.atsgray .r-head { background:#fff; border:1px solid #e5e5e5; border-radius:10px; padding:22px 26px; margin-bottom:16px; }
.atsgray .r-name { font-size:23pt; font-weight:700; color:#1a1a1a; }
.atsgray .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 7px; }
.atsgray .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.3pt; color:#666; }
.atsgray .r-block { background:#fff; border:1px solid #e5e5e5; border-radius:10px; padding:16px 20px; margin-bottom:12px; }
.atsgray .r-sec { font-size:9.3pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); margin:0 0 9px; }
.atsgray .skill-tag { background:#f0f0f0; color:#333; }
</style>
<div class="r-head">  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div></div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
</div>
