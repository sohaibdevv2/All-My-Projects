<div class="resume-template atsunder">
<style>
.atsunder { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atsunder .experience-entry,.atsunder .education-entry { margin-bottom:12px; }
.atsunder .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atsunder .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atsunder .entry-company,.atsunder .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsunder .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsunder .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atsunder ul { margin:0; padding-left:15px; }
.atsunder li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atsunder .r-block { margin-bottom:17px; }
.atsunder .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atsunder .r-name { font-size:24pt; font-weight:300; color:#1a1a1a; letter-spacing:2px; }
.atsunder .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:4px 0 8px; }
.atsunder .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.4pt; color:#555; margin-bottom:18px; }
.atsunder .r-sec { font-size:9.5pt; font-weight:600; text-transform:uppercase; letter-spacing:2px; color:#1a1a1a; margin:0 0 12px; padding-bottom:5px; border-bottom:2px solid var(--primary-color,#2d8653); display:inline-block; }
.atsunder .skill-tag { background:none; border:1px solid var(--primary-color,#2d8653); color:var(--primary-color,#2d8653); }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
</div>
