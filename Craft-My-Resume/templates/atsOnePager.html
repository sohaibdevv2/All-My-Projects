<div class="resume-template atsonepager">
<style>
.atsonepager { background:#fff; color:#1a1a1a; font-family:'Inter',sans-serif; font-size:8.5pt; line-height:1.45; padding:28px 38px; max-width:794px; margin:0 auto; }
.atsonepager .r-name { font-size:19pt; font-weight:800; color:#111; display:inline; }
.atsonepager .r-title { font-size:9.5pt; color:var(--primary-color,#2d8653); font-weight:600; display:inline; margin-left:12px; }
.atsonepager .r-contact { display:flex; flex-wrap:wrap; gap:3px 14px; font-size:7.8pt; color:#555; margin:4px 0 10px; border-bottom:1.5px solid var(--primary-color,#2d8653); padding-bottom:8px; }
.atsonepager .r-sec { font-size:8.5pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); margin:0 0 5px; }
.atsonepager .r-block { margin-bottom:10px; }
.atsonepager .r-sum { font-size:8.3pt; color:#444; line-height:1.55; }
.atsonepager .experience-entry,.atsonepager .education-entry { margin-bottom:7px; }
.atsonepager .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px; }
.atsonepager .entry-title { font-size:9pt; font-weight:700; color:#111; margin:0; }
.atsonepager .entry-company,.atsonepager .entry-school { font-size:8.3pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsonepager .entry-dates { font-size:7.8pt; color:#888; margin-left:auto; }
.atsonepager .entry-description { font-size:8.2pt; color:#555; line-height:1.45; margin-top:2px; }
.atsonepager ul { margin:0; padding-left:14px; } .atsonepager li { margin-bottom:2px; font-size:8.2pt; color:#555; }
.atsonepager .skill-tag { display:inline-block; padding:1px 8px; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; border-radius:3px; font-size:7.8pt; margin:0 3px 3px 0; }
.atsonepager .r-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
</style>
  <div>
    <span class="r-name" id="previewName">Your Name</span>
    <span class="r-title" id="previewJobTitle">Professional Title</span>
  </div>
  <div class="r-contact">
    <span id="previewEmail"></span>
    <span id="previewPhone"></span>
    <span id="previewLocation"></span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-grid">
    <div>
      <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
    </div>
    <div>
      <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
      <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
      <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
      <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
    </div>
  </div>
</div>
