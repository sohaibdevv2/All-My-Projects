<div class="resume-template cvacad-t">
<style>
.cvacad-t { background:#fff; color:#2d2d2d; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:40px 46px; max-width:794px; margin:0 auto; }
.cvacad-t .experience-entry,.cvacad-t .education-entry { margin-bottom:12px; }
.cvacad-t .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.cvacad-t .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.cvacad-t .entry-company,.cvacad-t .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.cvacad-t .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.cvacad-t .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.cvacad-t ul { margin:0; padding-left:15px; }
.cvacad-t li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.cvacad-t .skill-tag { display:inline-block; background:#f2f2f2; color:#333; padding:3px 9px; border-radius:4px; font-size:8pt; margin:0 4px 5px 0; }
.cvacad-t { font-family:'Georgia',serif; }
.cvacad-t .r-name { font-size:22pt; font-weight:700; text-align:center; text-transform:uppercase; letter-spacing:1px; color:#1a1a1a; }
.cvacad-t .r-title { font-size:11pt; text-align:center; color:#555; font-style:italic; margin:5px 0; }
.cvacad-t .r-contact { display:flex; justify-content:center; gap:16px; font-size:8.5pt; color:#555; border-bottom:2px solid #1a2e20; padding-bottom:12px; margin-bottom:16px; }
.cvacad-t .r-sec { font-size:10pt; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:#1a2e20; margin:0 0 10px; }
.cvacad-t .r-block { margin-bottom:18px; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Research Profile</div><p id="previewSummary" style="font-size:9.5pt;color:#333;line-height:1.7"></p></div>

  <div class="r-block"><div class="r-sec">Academic Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Publications & Projects</div><ul id="previewProjects"></ul></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>

</div>
