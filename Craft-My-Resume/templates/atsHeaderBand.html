<div class="resume-template atsband">
<style>
.atsband { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atsband .experience-entry,.atsband .education-entry { margin-bottom:12px; }
.atsband .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atsband .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atsband .entry-company,.atsband .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsband .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsband .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atsband ul { margin:0; padding-left:15px; }
.atsband li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atsband .r-block { margin-bottom:17px; }
.atsband .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atsband { padding:0; }
.atsband .r-band { background:var(--primary-color,#2d8653); color:#fff; padding:30px 48px; }
.atsband .r-body { padding:26px 48px; }
.atsband .r-name { font-size:25pt; font-weight:800; color:#fff; }
.atsband .r-title { font-size:11pt; color:rgba(255,255,255,0.9); font-weight:500; margin:3px 0 8px; }
.atsband .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.5pt; color:rgba(255,255,255,0.85); }
.atsband .r-sec { font-size:9.5pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); border-bottom:1px solid #e5e5e5; padding-bottom:4px; margin:0 0 10px; }
.atsband .skill-tag { background:#f0f6f2; color:#2d5a3f; }
</style>
<div class="r-band">  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div></div>
<div class="r-body">  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div></div>
</div>
