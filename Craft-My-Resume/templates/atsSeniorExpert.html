<div class="resume-template atssenior">
<style>
.atssenior { background:#fff; color:#1a1a1a; font-family:'Georgia',serif; font-size:9.2pt; line-height:1.55; padding:44px 52px; max-width:794px; margin:0 auto; }
.atssenior .r-name { font-size:24pt; font-weight:700; color:#111; letter-spacing:0.5px; text-align:center; }
.atssenior .r-title { font-size:11pt; color:var(--primary-color,#2d8653); font-weight:400; text-align:center; margin:4px 0 8px; font-style:italic; }
.atssenior .r-contact { display:flex; justify-content:center; gap:16px; font-size:8.2pt; color:#555; font-family:'Inter',sans-serif; border-top:1px solid #d1d5db; border-bottom:1px solid #d1d5db; padding:8px 0; margin-bottom:18px; }
.atssenior .r-sec { font-size:10pt; font-weight:700; color:#111; text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid var(--primary-color,#2d8653); padding-bottom:3px; margin:0 0 10px; }
.atssenior .r-block { margin-bottom:18px; }
.atssenior .r-sum { font-size:9pt; color:#444; line-height:1.7; }
.atssenior .experience-entry,.atssenior .education-entry { margin-bottom:13px; }
.atssenior .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atssenior .entry-title { font-size:10pt; font-weight:700; color:#111; margin:0; }
.atssenior .entry-company,.atssenior .entry-school { font-size:9pt; color:var(--primary-color,#2d8653); font-weight:600; font-style:italic; }
.atssenior .entry-dates { font-size:8.2pt; color:#888; margin-left:auto; font-family:'Inter',sans-serif; }
.atssenior .entry-description { font-size:8.6pt; color:#555; line-height:1.6; margin-top:3px; font-family:'Inter',sans-serif; }
.atssenior ul { margin:0; padding-left:16px; } .atssenior li { margin-bottom:3px; font-size:8.6pt; color:#555; font-family:'Inter',sans-serif; }
.atssenior .skill-tag { display:inline-block; padding:1px 0; font-size:8.5pt; color:#333; font-family:'Inter',sans-serif; }

.atssenior .skill-tag:last-child::after { content:''; }
