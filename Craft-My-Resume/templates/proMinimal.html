<div class="resume-template proMinimal-template">
<style>
.proMinimal-template { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.55; padding:46px 50px; max-width:794px; margin:0 auto; }
.proMinimal-template .pm-name { font-size:26pt; font-weight:300; color:#1a1a1a; letter-spacing:2px; text-align:center; text-transform:uppercase; }
.proMinimal-template .pm-title { font-size:10pt; color:var(--primary-color,#2d8653); font-weight:500; text-align:center; letter-spacing:3px; text-transform:uppercase; margin:6px 0 10px; }
.proMinimal-template .pm-contact { display:flex; justify-content:center; flex-wrap:wrap; gap:6px 18px; font-size:8.3pt; color:#666; padding-bottom:16px; border-bottom:1px solid #ddd; margin-bottom:18px; }
.proMinimal-template .pm-sec-title { font-size:9.5pt; font-weight:600; text-transform:uppercase; letter-spacing:2px; color:#1a1a1a; text-align:center; margin:0 0 12px; position:relative; }
.proMinimal-template .pm-sec-title::after { content:''; display:block; width:36px; height:2px; background:var(--primary-color,#2d8653); margin:6px auto 0; }
.proMinimal-template .pm-block { margin-bottom:20px; }
.proMinimal-template .pm-summary { font-size:9pt; color:#555; line-height:1.7; text-align:center; max-width:560px; margin:0 auto 20px; font-style:italic; }
.proMinimal-template .experience-entry, .proMinimal-template .education-entry { margin-bottom:14px; }
.proMinimal-template .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.proMinimal-template .entry-title { font-size:10pt; font-weight:700; color:#1a1a1a; margin:0; }
.proMinimal-template .entry-company, .proMinimal-template .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); }
.proMinimal-template .entry-dates { font-size:8pt; color:#999; margin-left:auto; }
.proMinimal-template .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.proMinimal-template .skill-tag { display:inline-block; color:#444; padding:2px 0; font-size:8.6pt; margin:0 12px 4px 0; border-bottom:1px solid var(--primary-color,#2d8653); }
.proMinimal-template ul { margin:0; padding-left:16px; }
.proMinimal-template li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.proMinimal-template .pm-skills-wrap { text-align:center; }
</style>
