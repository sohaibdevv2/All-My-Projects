<div class="resume-template atsmidlevel">
<style>
.atsmidlevel { background:#fff; color:#1a1a1a; font-family:'Inter',sans-serif; font-size:9pt; line-height:1.55; max-width:794px; margin:0 auto; }
.atsmidlevel .r-header { background:#fff; padding:28px 48px 18px; }
.atsmidlevel .r-name { font-size:22pt; font-weight:800; color:#111; }
.atsmidlevel .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 10px; }
.atsmidlevel .r-contact { display:flex; flex-wrap:wrap; gap:3px 16px; font-size:8pt; color:#555; border-top:2px solid var(--primary-color,#2d8653); padding-top:8px; }
.atsmidlevel .r-columns { display:grid; grid-template-columns:1.6fr 1fr; padding:20px 28px 20px 48px; gap:28px; }
.atsmidlevel .r-sec { font-size:9pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); border-bottom:1px solid #e5e7eb; padding-bottom:4px; margin:0 0 9px; }
.atsmidlevel .r-block { margin-bottom:16px; }
.atsmidlevel .r-sum { font-size:8.8pt; color:#444; line-height:1.65; }
.atsmidlevel .experience-entry,.atsmidlevel .education-entry { margin-bottom:11px; }
.atsmidlevel .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px; }
.atsmidlevel .entry-title { font-size:9.5pt; font-weight:700; color:#111; margin:0; }
.atsmidlevel .entry-company,.atsmidlevel .entry-school { font-size:8.5pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsmidlevel .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsmidlevel .entry-description { font-size:8.3pt; color:#555; line-height:1.5; margin-top:2px; }
.atsmidlevel ul { margin:0; padding-left:14px; } .atsmidlevel li { margin-bottom:3px; font-size:8.3pt; color:#555; }
.atsmidlevel .skill-tag { display:block; padding:3px 0; font-size:8.2pt; color:#333; border-bottom:1px solid #f3f4f6; }
</style>
  <div class="r-header">
    <div class="r-name" id="previewName">Your Name</div>
    <div class="r-title" id="previewJobTitle">Professional Title</div>
    <div class="r-contact">
      <span id="previewEmail"></span>
      <span id="previewPhone"></span>
      <span id="previewLocation"></span>
      <span id="previewLinkedIn"></span>
    </div>
  </div>
  <div class="r-columns">
    <div>
      <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
      <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
      <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
    </div>
    <div>
      <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
      <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
      <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
      <div class="r-block"><div class="r-sec">Languages</div><div id="previewLanguages"></div></div>
    </div>
  </div>
</div>
