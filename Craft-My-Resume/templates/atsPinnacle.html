<div class="resume-template atspinnacle">
<style>
.atspinnacle { background:#fff; color:#1a1a1a; font-family:'Inter',sans-serif; font-size:9pt; line-height:1.55; padding:44px 52px; max-width:794px; margin:0 auto; }
.atspinnacle .r-name { font-size:26pt; font-weight:800; color:#111; letter-spacing:-0.5px; }
.atspinnacle .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 8px; }
.atspinnacle .r-contact { display:flex; flex-wrap:wrap; gap:4px 18px; font-size:8pt; color:#555; padding-bottom:12px; border-bottom:2px solid var(--primary-color,#2d8653); margin-bottom:18px; }
.atspinnacle .r-sec { font-size:9.5pt; font-weight:800; text-transform:uppercase; letter-spacing:1.2px; color:var(--primary-color,#2d8653); margin:0 0 8px; }
.atspinnacle .r-block { margin-bottom:18px; }
.atspinnacle .r-sum { font-size:8.8pt; color:#444; line-height:1.65; }
.atspinnacle .experience-entry, .atspinnacle .education-entry { margin-bottom:12px; }
.atspinnacle .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atspinnacle .entry-title { font-size:9.8pt; font-weight:700; color:#111; margin:0; }
.atspinnacle .entry-company, .atspinnacle .entry-school { font-size:8.8pt; color:#444; font-weight:500; }
.atspinnacle .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atspinnacle .entry-description { font-size:8.5pt; color:#555; line-height:1.55; margin-top:3px; }
.atspinnacle ul { margin:0; padding-left:16px; } .atspinnacle li { margin-bottom:3px; font-size:8.5pt; color:#555; }
.atspinnacle .skill-tag { display:inline-block; padding:2px 10px; border:1px solid var(--primary-color,#2d8653); color:var(--primary-color,#2d8653); border-radius:3px; font-size:8pt; margin:0 4px 4px 0; }
