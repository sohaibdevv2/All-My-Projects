<div class="resume-template atstwo">
<style>
.atstwo { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atstwo .experience-entry,.atstwo .education-entry { margin-bottom:12px; }
.atstwo .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atstwo .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atstwo .entry-company,.atstwo .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atstwo .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atstwo .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atstwo ul { margin:0; padding-left:15px; }
.atstwo li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atstwo .r-block { margin-bottom:17px; }
.atstwo .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atstwo .r-top { border-bottom:2px solid var(--primary-color,#2d8653); padding-bottom:12px; margin-bottom:16px; }
.atstwo .r-name { font-size:23pt; font-weight:700; color:#1a1a1a; }
.atstwo .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 6px; }
.atstwo .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.3pt; color:#555; }
.atstwo .r-cols { display:grid; grid-template-columns:1.7fr 1fr; gap:26px; }
.atstwo .r-sec { font-size:9.3pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary-color,#2d8653); border-bottom:1px solid #e5e5e5; padding-bottom:3px; margin:0 0 9px; }
.atstwo .skill-tag { background:#f0f6f2; color:#2d5a3f; }
</style>
<div class="r-top">  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div></div>
<div class="r-cols"><div>  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div></div><div>  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>  <div class="r-block"><div class="r-sec">Languages</div><div id="previewLanguages"></div></div>  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div></div></div>
</div>
