<div class="resume-template gl-tpl">
<style>
.gl-tpl { background:#fff; color:#2a2a2a; font-family:'Calibri','Arial',sans-serif; font-size:9pt; line-height:1.45; padding:36px 44px; max-width:794px; margin:0 auto; }
.gl-tpl .r-name { font-size:20pt; font-weight:700; color:#1a1a1a; margin:0 0 2px; }
.gl-tpl .r-title { font-size:10pt; color:var(--primary-color,#2d8653); font-weight:600; margin:0 0 4px; }
.gl-tpl .r-contact { font-size:8.6pt; color:#444; margin-bottom:12px; }
.gl-tpl .r-contact span:not(:last-child)::after { content:'   •   '; color:#999; }
.gl-tpl .r-sec { font-size:9.5pt; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:#333; background:#eceef0; padding:4px 10px; margin:12px 0 8px; border-left:3px solid var(--primary-color,#2d8653); }
.gl-tpl .r-block { margin-bottom:5px; }
.gl-tpl .r-sum { font-size:9pt; color:#333; line-height:1.5; margin:0; }
.gl-tpl .experience-entry,.gl-tpl .education-entry { margin-bottom:10px; }
.gl-tpl .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; }
.gl-tpl .entry-title { font-size:9.6pt; font-weight:700; color:#1a1a1a; margin:0; }
.gl-tpl .entry-dates { font-size:8.4pt; color:#777; margin-left:auto; }
.gl-tpl .entry-company,.gl-tpl .entry-school { font-size:9pt; color:var(--primary-color,#2d8653); font-weight:600; flex-basis:100%; margin-top:1px; }
.gl-tpl .entry-description { font-size:8.8pt; color:#333; line-height:1.5; margin-top:3px; }
.gl-tpl .entry-description ul { margin:2px 0; padding-left:16px; }
.gl-tpl .entry-description li { margin-bottom:2px; }
.gl-tpl #previewSkills .skill-tag { display:inline-block; background:#eceef0; color:#333; padding:2px 9px; border-radius:3px; font-size:8.4pt; margin:0 4px 4px 0; }
.gl-tpl #previewLanguages .skill-tag:not(:last-child)::after { content:', '; }
.gl-tpl ul.r-list { margin:2px 0; padding-left:16px; }
.gl-tpl ul.r-list li { margin-bottom:2px; font-size:8.8pt; color:#333; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Work Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications &amp; Training</div><ul class="r-list" id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul class="r-list" id="previewProjects"></ul></div>
  <div class="r-block"><div class="r-sec">Achievements</div><ul class="r-list" id="previewAwards"></ul></div>
  <div class="r-block"><div class="r-sec">Languages</div><div id="previewLanguages"></div></div>
</div>
