<div class="resume-template atsleft">
<style>
.atsleft { background:#fff; color:#333; font-family:'Inter',sans-serif; font-size:9.2pt; line-height:1.5; padding:42px 48px; max-width:794px; margin:0 auto; }
.atsleft .experience-entry,.atsleft .education-entry { margin-bottom:12px; }
.atsleft .entry-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
.atsleft .entry-title { font-size:9.8pt; font-weight:700; color:#1a1a1a; margin:0; }
.atsleft .entry-company,.atsleft .entry-school { font-size:8.8pt; color:var(--primary-color,#2d8653); font-weight:600; }
.atsleft .entry-dates { font-size:8pt; color:#888; margin-left:auto; }
.atsleft .entry-description { font-size:8.6pt; color:#555; line-height:1.55; margin-top:3px; }
.atsleft ul { margin:0; padding-left:15px; }
.atsleft li { font-size:8.6pt; color:#555; margin-bottom:3px; }
.atsleft .r-block { margin-bottom:17px; }
.atsleft .r-sum { font-size:9pt; color:#444; line-height:1.6; }
.atsleft { border-left:6px solid var(--primary-color,#2d8653); }
.atsleft .r-name { font-size:23pt; font-weight:700; color:#1a1a1a; }
.atsleft .r-title { font-size:10.5pt; color:var(--primary-color,#2d8653); font-weight:600; margin:3px 0 8px; }
.atsleft .r-contact { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:8.5pt; color:#555; padding-bottom:12px; border-bottom:1px solid #e5e5e5; margin-bottom:15px; }
.atsleft .r-sec { font-size:9.5pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#1a1a1a; margin:0 0 10px; position:relative; padding-left:12px; }
.atsleft .r-sec::before { content:''; position:absolute; left:0; top:2px; bottom:2px; width:3px; background:var(--primary-color,#2d8653); }
.atsleft .skill-tag { background:#f0f6f2; color:#2d5a3f; }
</style>
  <div class="r-name" id="previewName">Your Name</div>
  <div class="r-title" id="previewJobTitle">Professional Title</div>
  <div class="r-contact">
    <span id="previewEmail">email@example.com</span>
    <span id="previewPhone">+1 555 123 4567</span>
    <span id="previewLocation">City, Country</span>
    <span id="previewLinkedIn"></span>
  </div>
  <div class="r-block"><div class="r-sec">Summary</div><p class="r-sum" id="previewSummary"></p></div>
  <div class="r-block"><div class="r-sec">Experience</div><div id="previewExperience"></div></div>
  <div class="r-block"><div class="r-sec">Education</div><div id="previewEducation"></div></div>
  <div class="r-block"><div class="r-sec">Skills</div><div id="previewSkills"></div></div>
  <div class="r-block"><div class="r-sec">Certifications</div><ul id="previewCertifications"></ul></div>
  <div class="r-block"><div class="r-sec">Projects</div><ul id="previewProjects"></ul></div>
</div>
